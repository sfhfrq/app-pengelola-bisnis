name: Deploy Frontend ke GitHub Pages

# Dijalankan otomatis setiap kali folder Frontend berubah,
# dan bisa juga dijalankan manual dari tab Actions (tombol "Run workflow").
on:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jangan biarkan dua deploy berjalan bersamaan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Pasang dependensi
        working-directory: Frontend
        run: npm ci

      # VITE_BASE dihitung dari nama repo: situs GitHub Pages disajikan
      # dari /<nama-repo>/, jadi aset harus memakai base yang sama.
      # VITE_API_BASE diambil dari repository variable.
      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Ingatkan kalau VITE_API_BASE belum diatur
        if: vars.VITE_API_BASE == ''
        run: |
          echo "::warning::Repository variable VITE_API_BASE belum diisi — situs akan terbuka tetapi tidak bisa memuat data."
          {
            echo "### ⚠️ VITE_API_BASE belum diatur"
            echo ""
            echo "Situsnya akan terbuka, tetapi login dan data akan gagal karena frontend tidak tahu alamat backend."
            echo ""
            echo "Isi di **Settings → Secrets and variables → Actions → Variables**, nama variabel \`VITE_API_BASE\`,"
            echo "nilainya alamat backend + \`/api\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Nyalakan Pages otomatis kalau belum aktif, supaya tidak perlu
          # menyetel Source secara manual di Settings.
          enablement: true

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
